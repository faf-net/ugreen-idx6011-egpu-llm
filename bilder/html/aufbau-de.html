      <title id="aufbau-de-title">Chat, Agent und Bilder auf einer Karte, und fast nichts verl</title>
      <desc id="aufbau-de-desc">Laptop und Handy, zu Hause oder unterwegs, sprechen mit Open WebUI, OpenCode 2 und Hermes Agent, mit dem Agenten auch über einen Messenger-Dienst. Alle drei fragen das Sprachmodell über die Weiche llama-swap, die auf der RX 7900 XTX entweder Flash-Next 125B oder ComfyUI lädt. Der Chat sucht über SearXNG, das Suchmaschinen über ein VPN fragt. Der Agent sucht über einen Suchdienst mit Konto, liest Webseiten über Crawl4AI und ein VPN, startet Abläufe in n8n über MCP, liest die Post über die Proton Bridge, die sie im Haus entschlüsselt (Proton Mail draußen speichert sie verschlüsselt), merkt sich Gespräche in Hindsight und nutzt ein eigenes Postfach mit PGP: alle signiert, an mich zusätzlich verschlüsselt; Mails von mir entschlüsselt er im Haus und prüft die Signatur. Gestrichelt ist, was das Haus verlässt.</desc>
