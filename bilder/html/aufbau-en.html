      <title id="aufbau-en-title">Chat, agent and images on one card, and almost nothing leave</title>
      <desc id="aufbau-en-desc">Laptop and phone, at home or away, talk to Open WebUI, OpenCode 2 and Hermes Agent, to the agent also through a messenger service. All three ask the language model through the llama-swap switch, which loads either Flash-Next 125B or ComfyUI on the RX 7900 XTX. The chat searches through SearXNG, which asks search engines through a VPN. The agent searches through a search service with an account, reads web pages through Crawl4AI and a VPN, starts workflows in n8n through MCP, reads mail through the Proton Bridge, which decrypts it at home (Proton Mail outside stores it encrypted), remembers conversations in Hindsight and uses its own mailbox with PGP: all signed, to me also encrypted; it decrypts my mail at home and checks the signature. Dashed is what leaves the house.</desc>
