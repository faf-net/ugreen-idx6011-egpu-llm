      <desc id="aufbau-en-desc">Laptop and phone talk to Open WebUI and to Hermes Agent in the home network, to the agent also through a messenger service; both ask llama-swap, as does OpenCode 2, which runs as a service in the home network and is used from the browser or the terminal. Hermes starts fixed workflows in n8n through MCP, which in turn ask Flash-Next through llama-swap. What the agent learns from conversations is stored by Hindsight in the home network; the same language model extracts the facts. llama-swap loads either the language model or ComfyUI on the RX 7900 XTX. The agent reads web pages through Crawl4AI on the iDX, which fetches them through a VPN. Only search queries, the pages the agent reads and messenger messages leave the house.</desc>
