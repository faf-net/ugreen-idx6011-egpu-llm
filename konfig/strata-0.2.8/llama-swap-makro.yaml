# Strata 0.2.8 aus den fertigen Release-Paketen (so läuft es hier seit 31.10.2026; vorher 0.2.3.1).
# Engine:  strata-engine-0.1.54-linux-x86_64-hip-rx7900.tar.gz   → /pfad/zu/0.2.8/engine
# Server:  strata-control-0.1.54-linux-x86_64.tar.gz            → /pfad/zu/0.2.8/control
# Beide Archive gegen SHA256SUMS.txt des Releases prüfen und ohne --strip-components entpacken.
# Die Laufkonfigurationen sind dieselben wie für 0.2.3.1; nur Engine und Control sind getauscht.
# Neu in 0.2.8: leicht fehlerhafte Tool-Calls werden standardmäßig gerettet ("tool_call_recovery": false schaltet es ab).
# faber nutzt --kv-resident 32768 und einen Gesprächs-Cache von 4 Plätzen / 9.216 MiB; das braucht 64 GB RAM.

macros:
  strata028: >-
    docker run --rm --name ls-${MODEL_ID} --network host
    --device /dev/kfd --device /dev/dri --group-add 44 --group-add 105
    --security-opt seccomp=unconfined --ipc host --ulimit memlock=-1 --ulimit stack=67108864
    -v /pfad/zu/strata-data:/strata/data
    -v /pfad/zu/konfig/strata-0.2.8:/strata/konfig
    -v /pfad/zu/0.2.8/engine:/opt/engine -v /pfad/zu/0.2.8/control:/opt/strata
    -e STRATA_ENGINE=/opt/engine/strata -w /opt/strata strata-hip:v0.1.45
    /opt/strata/python/bin/python3 serve/server.py --engine strata --port ${PORT} --config

models:
  faber:
    name: "Flash-Next 125B (Strata 0.2.8, IQ3_XXS)"
    aliases: [arbeit]
    cmd: ${strata028} /strata/konfig/faber.json
    cmdStop: docker stop -t 80 ls-${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 1800

  velox:
    name: "Flash-Next 125B (Strata 0.2.8, IQ2_XS)"
    aliases: [schnell]
    cmd: ${strata028} /strata/konfig/velox.json
    cmdStop: docker stop -t 80 ls-${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 1800
