  # Bildmodelle (23.10.2026): ComfyUI mit ROCm 7.2 auf der XTX, abwechselnd mit Strata.
  # Der Name comfyui_auto ist fest: llama-swap bedient damit /comfyui/ und lässt die offene
  # Browser-Verbindung (Websocket) das Modell weder laden noch festhalten.
  comfyui_auto:
    name: "Bilder — ComfyUI (Qwen-Image 2.1, Z-Image Turbo, Chroma1-HD)"
    description: "Browser unter /comfyui/, Hermes über image_generate. Belegt die XTX allein; faber/velox/liber werden dafür entladen."
    cmd: >-
      docker run --rm --name comfyui-auto
      --device /dev/kfd --device /dev/dri --group-add 44 --group-add 105
      --ipc host --cap-add SYS_PTRACE --security-opt seccomp=unconfined
      -p 127.0.0.1:${PORT}:8188
      -v /pfad/zu/comfyui/storage:/root
      -v /pfad/zu/comfyui/models:/root/ComfyUI/models
      -v /pfad/zu/comfyui/hf-hub:/root/.cache/huggingface/hub
      -v /pfad/zu/comfyui/torch-hub:/root/.cache/torch/hub
      -v /pfad/zu/comfyui/input:/root/ComfyUI/input
      -v /pfad/zu/comfyui/output:/root/ComfyUI/output
      -v /pfad/zu/comfyui/workflows:/root/ComfyUI/user/default/workflows
      -e HSA_OVERRIDE_GFX_VERSION=11.0.0
      -e CLI_ARGS="--listen 0.0.0.0 --port 8188"
      yanwk/comfyui-boot:rocm-20261019
    cmdStop: docker stop -t 30 comfyui-auto
    checkEndpoint: /
    unloadTimeout: 40
    ttl: 1800
    unlisted: true
